<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Disponibilités — Riad Dar Num</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;600&display=swap">
<style>
  /* Intégré en iframe de hauteur fixe dans riaddarnum.com. D'où la contrainte
     centrale de cette page : la hauteur ne varie jamais, quel que soit le
     nombre de mois de données ou la largeur de l'écran. On navigue de mois en
     mois, on n'empile pas. */
  :root{
    --ground:#F6F5F1; --card:#FFFFFF; --ink:#22282A; --muted:#6E7772; --line:#E2E4DD;
    --free-bg:#FFFFFF; --free-br:#CFD4CA; --busy-bg:#E1E5DD; --busy-ink:#6F7872;
    --accent:#1E6B57; --warn:#8A5A1E;
  }
  @media (prefers-color-scheme: dark){
    :root[data-theme="auto"]{
      --ground:#141817; --card:#1C2120; --ink:#E8EBE6; --muted:#98A09A; --line:#2A302E;
      --free-bg:#232928; --free-br:#3F4744; --busy-bg:#191D1C; --busy-ink:#767E79;
      --accent:#4FA98D; --warn:#D6A461;
    }
  }
  :root[data-theme="dark"]{
    --ground:#141817; --card:#1C2120; --ink:#E8EBE6; --muted:#98A09A; --line:#2A302E;
    --free-bg:#232928; --free-br:#3F4744; --busy-bg:#191D1C; --busy-ink:#767E79;
    --accent:#4FA98D; --warn:#D6A461;
  }
  :root[data-ground="none"]{ --ground:transparent }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--ground); color:var(--ink);
    font-family:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(10px,2.5vw,18px);
  }
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
      clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
  .wrap{width:100%;max-width:1080px;display:flex;flex-direction:column;gap:12px}

  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .titre{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-optical-sizing:auto;
         font-size:1.22rem;font-weight:400;margin:0;letter-spacing:-.01em;flex:1 1 auto}
  .legend{display:flex;gap:14px;font-size:.75rem;color:var(--muted);flex:0 0 auto}
  .legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .sw{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid var(--free-br)}
  .sw.free{background:var(--free-bg)}
  .sw.busy{background:var(--busy-bg)}
  .nav{display:flex;gap:6px;flex:0 0 auto}
  .nav button{
    width:34px;height:34px;border-radius:8px;border:1px solid var(--free-br);
    background:var(--card);color:var(--ink);font-size:.95rem;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s ease,opacity .15s ease;
  }
  .nav button:hover:not(:disabled){border-color:var(--accent)}
  .nav button:disabled{opacity:.3;cursor:default}
  .nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* Sur écran étroit, les flèches restent à côté du titre et la légende
     passe seule à la ligne : plus lisible que l'inverse. */
  @media (max-width:659px){
    .legend{order:3;flex-basis:100%;justify-content:center}
  }
  .months{display:grid;gap:14px;grid-template-columns:1fr;justify-content:center}
  .m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;
     max-width:330px;width:100%;margin:0 auto}
  .cal{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed;margin:4px -4px -4px}
  .cal caption{text-align:left;padding:0 4px 4px}
  .cal caption b{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:.98rem;display:block}
  .cal caption b .yr{color:var(--muted);font-weight:400}
  .cal caption em{font-style:normal;font-size:.72rem;color:var(--muted)}
  .cal th{font-size:.63rem;color:var(--muted);text-transform:uppercase;
          letter-spacing:.07em;font-weight:600;padding:0 0 2px}
  .cal th abbr{text-decoration:none}
  .cal td{padding:0}
  .d{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
     font-size:.8rem;border-radius:6px;border:1px solid transparent}
  .d.free{background:var(--free-bg);border-color:var(--free-br)}
  .d.busy{background:var(--busy-bg);color:var(--busy-ink);
          text-decoration:line-through;text-decoration-thickness:1px}
  .d.past{opacity:.35}
  .d.pad{visibility:hidden}

  .note{font-size:.76rem;color:var(--muted);margin:0;text-align:center}
  .note.alert{color:var(--warn);font-weight:500}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1 class="titre">Disponibilités</h1>
    <div class="legend" aria-hidden="true">
      <span><span class="sw free"></span>Disponible</span>
      <span><span class="sw busy"></span>Réservé</span>
    </div>
    <div class="nav">
      <button type="button" id="prec" aria-label="Mois précédents" disabled>‹</button>
      <button type="button" id="suiv" aria-label="Mois suivants" disabled>›</button>
    </div>
  </div>

  <div class="months" id="months" aria-live="polite"></div>

  <p class="note" id="note" role="status">Chargement des disponibilités…</p>
</div>

<script>
(function(){
  "use strict";

  var MOIS = ['janvier','février','mars','avril','mai','juin',
              'juillet','août','septembre','octobre','novembre','décembre'];
  var JOURS = [['L','lundi'],['M','mardi'],['M','mercredi'],['J','jeudi'],
               ['V','vendredi'],['S','samedi'],['D','dimanche']];
  var FUSEAU = 'Africa/Casablanca';
  var PEREMPTION = 3;      // jours au-delà desquels les données sont annoncées comme datées
  var DELAI_FETCH = 8000;  // ms

  var elMois = document.getElementById('months');
  var elNote = document.getElementById('note');
  var btnPrec = document.getElementById('prec');
  var btnSuiv = document.getElementById('suiv');

  var theme = (new URLSearchParams(location.search).get('theme') || '').toLowerCase();
  if (theme === 'dark' || theme === 'auto') document.documentElement.setAttribute('data-theme', theme);
  if (theme === 'transparent') document.documentElement.setAttribute('data-ground', 'none');

  var cles = [], occ = {}, today = null, debut = 0;

  // « Aujourd'hui » au Maroc, pas dans le fuseau du visiteur : un client à Sydney
  // ne doit pas voir une nuit marquée passée alors qu'elle est encore réservable.
  function aujourdhui(){
    try {
      var p = new Intl.DateTimeFormat('en-CA', {timeZone: FUSEAU, year:'numeric', month:'2-digit', day:'2-digit'})
                .formatToParts(new Date())
                .reduce(function(a, x){ a[x.type] = x.value; return a; }, {});
      return new Date(+p.year, +p.month - 1, +p.day);
    } catch (e) {
      var d = new Date();
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }
  }

  // Élision : « d'octobre », pas « de octobre ».
  function deMois(m){ return (/^[aeiouyéèêâ]/.test(MOIS[m]) ? "d'" : 'de ') + MOIS[m]; }

  function texte(msg, alerte){
    elNote.textContent = msg;
    elNote.classList.toggle('alert', !!alerte);
  }

  // Nombre de mois affichables côte à côte, déduit de la largeur réellement
  // mesurée du conteneur puis appliqué directement à la grille. Les points de
  // rupture CSS et le rendu JavaScript ne peuvent donc pas diverger, ce qui
  // arrivait dans l'iframe du site où l'on obtenait un seul mois dans un cadre
  // large.
  var LARGEUR_CARTE = 330, ECART = 14;

  function parEcran(){
    var w = elMois.getBoundingClientRect().width || document.documentElement.clientWidth;
    var n = Math.floor((w + ECART) / (LARGEUR_CARTE + ECART));
    return Math.max(1, Math.min(3, n));
  }

  function carte(ym){
    var p = ym.split('-'), y = +p[0], m = +p[1] - 1;
    var joursPris = new Set((occ[ym] || []).filter(function(n){ return Number.isInteger(n); }));
    var nbJours = new Date(y, m + 1, 0).getDate();
    var decalage = (new Date(y, m, 1).getDay() + 6) % 7;   // semaine commençant lundi
    var cases = [], libres = 0, i;

    for (i = 0; i < decalage; i++) cases.push('<td><span class="d pad"></span></td>');
    for (var j = 1; j <= nbJours; j++){
      var passe = new Date(y, m, j) < today;
      var pris = joursPris.has(j);
      if (!pris && !passe) libres++;
      cases.push('<td><span class="d ' + (pris ? 'busy' : 'free') + (passe ? ' past' : '') + '">'
               + j + '<span class="sr"> ' + (pris ? 'réservé' : 'disponible') + '</span></span></td>');
    }
    while (cases.length < 42) cases.push('<td><span class="d pad"></span></td>');   // six semaines toujours

    var lignes = '';
    for (i = 0; i < cases.length; i += 7) lignes += '<tr>' + cases.slice(i, i + 7).join('') + '</tr>';
    var entete = JOURS.map(function(d){
      return '<th scope="col"><abbr title="' + d[1] + '">' + d[0] + '</abbr></th>';
    }).join('');

    return '<div class="m"><table class="cal"><caption>'
         + '<b>' + MOIS[m] + ' <span class="yr">' + y + '</span></b>'
         + '<em>' + (libres === 0 ? 'complet' : libres + (libres > 1 ? ' nuits libres' : ' nuit libre')) + '</em>'
         + '</caption><thead><tr>' + entete + '</tr></thead><tbody>' + lignes + '</tbody></table></div>';
  }

  function afficher(){
    var n = parEcran();
    if (debut > cles.length - n) debut = Math.max(0, cles.length - n);
    elMois.style.gridTemplateColumns = 'repeat(' + n + ', minmax(0, 1fr))';
    elMois.innerHTML = cles.slice(debut, debut + n).map(carte).join('');
    btnPrec.disabled = debut === 0;
    btnSuiv.disabled = debut + n >= cles.length;
  }

  btnPrec.addEventListener('click', function(){ debut = Math.max(0, debut - 1); afficher(); });
  btnSuiv.addEventListener('click', function(){ debut = debut + 1; afficher(); });

  // La page hôte peut redimensionner l'iframe après le chargement, sans qu'un
  // évènement resize nous parvienne toujours. On surveille donc directement la
  // racine du document, et on repasse une fois au chargement complet.
  var redim;
  function replanifier(){
    clearTimeout(redim);
    redim = setTimeout(afficher, 120);
  }
  window.addEventListener('resize', replanifier);
  window.addEventListener('load', replanifier);
  if (window.ResizeObserver) new ResizeObserver(replanifier).observe(document.documentElement);

  function render(data){
    if (!data || typeof data !== 'object') throw new Error('format');
    occ = data;
    today = aujourdhui();

    // Mois valides et non entièrement écoulés : si le flux se fige, la page
    // cesse d'afficher des mois périmés plutôt que de mentir.
    cles = Object.keys(occ).filter(function(k){
      if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(k) || !Array.isArray(occ[k])) return false;
      var p = k.split('-');
      return new Date(+p[0], +p[1], 0) >= today;
    }).sort();

    if (!cles.length){
      elMois.innerHTML = '';
      texte('Le calendrier est en cours de mise à jour. Indiquez vos dates dans le formulaire, nous vous confirmons la disponibilité.', true);
      return;
    }
    afficher();

    var dernier = cles[cles.length - 1].split('-');
    var horizon = 'Dates ouvertes jusqu\'à ' + MOIS[+dernier[1] - 1] + ' ' + dernier[0]
                + '. Au-delà, nous consulter.';
    var maj = /^\d{4}-\d{2}-\d{2}$/.test(occ._updated || '') ? occ._updated.split('-') : null;

    if (!maj){ texte(horizon, false); return; }
    var age = Math.round((today - new Date(+maj[0], +maj[1] - 1, +maj[2])) / 86400000);
    var libelle = Number(maj[2]) + ' ' + MOIS[+maj[1] - 1] + ' ' + maj[0];
    if (age > PEREMPTION){
      texte('Ces disponibilités datent du ' + libelle + '. Merci de les confirmer avec nous avant de réserver.', true);
    } else {
      texte('Mise à jour le ' + libelle + '. ' + horizon, false);
    }
  }

  var stop = window.AbortController ? new AbortController() : null;
  var minuteur = setTimeout(function(){ if (stop) stop.abort(); }, DELAI_FETCH);

  fetch('occupancy.json', {cache: 'no-cache', signal: stop ? stop.signal : undefined})
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(data){ clearTimeout(minuteur); render(data); })
    .catch(function(){
      clearTimeout(minuteur);
      elMois.innerHTML = '';
      texte('Disponibilités momentanément indisponibles. Indiquez vos dates dans le formulaire, nous vous répondons rapidement.', true);
    });
})();
</script>
</body>
</html>
