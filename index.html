<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Disponibilités — Riad Dar Num</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;600&display=swap">
<style>
  /* Palette claire par défaut : la page est destinée à être intégrée dans
     riaddarnum.com, qui est un site clair. Le mode sombre ne s'active que
     sur demande explicite de la page hôte, via ?theme=dark ou ?theme=auto. */
  :root{
    --ground:#F6F5F1; --card:#FFFFFF; --ink:#22282A; --muted:#6E7772; --line:#E2E4DD;
    --free-bg:#FFFFFF; --free-br:#CFD4CA; --busy-bg:#E1E5DD; --busy-ink:#6F7872;
    --accent:#1E6B57; --accent-ink:#FFFFFF; --warn:#8A5A1E;
    --shadow:0 1px 2px rgba(34,40,42,.05), 0 8px 24px rgba(34,40,42,.04);
  }
  @media (prefers-color-scheme: dark){
    :root[data-theme="auto"]{
      --ground:#141817; --card:#1C2120; --ink:#E8EBE6; --muted:#98A09A; --line:#2A302E;
      --free-bg:#232928; --free-br:#3F4744; --busy-bg:#191D1C; --busy-ink:#767E79;
      --accent:#4FA98D; --accent-ink:#0F1413; --warn:#D6A461;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.22);
    }
  }
  :root[data-theme="dark"]{
    --ground:#141817; --card:#1C2120; --ink:#E8EBE6; --muted:#98A09A; --line:#2A302E;
    --free-bg:#232928; --free-br:#3F4744; --busy-bg:#191D1C; --busy-ink:#767E79;
    --accent:#4FA98D; --accent-ink:#0F1413; --warn:#D6A461;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.22);
  }
  /* ?theme=transparent : laisse le fond de la page hôte transparaître. */
  :root[data-ground="none"]{ --ground:transparent }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    padding:clamp(20px,4vw,40px) clamp(14px,3vw,28px);
    background:var(--ground); color:var(--ink);
    font-family:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  }
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
      clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
  .wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(20px,3.4vw,32px)}
  header{display:flex;flex-direction:column;gap:6px}
  .eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  h1{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-optical-sizing:auto;
     font-size:clamp(1.7rem,4vw,2.4rem);font-weight:400;line-height:1.1;margin:0;
     text-wrap:balance;letter-spacing:-.015em}
  .lede{color:var(--muted);font-size:.95rem;max-width:52ch;margin:0}

  .legend{display:flex;flex-wrap:wrap;gap:20px;font-size:.82rem;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:8px}
  .sw{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid var(--free-br)}
  .sw.free{background:var(--free-bg)}
  .sw.busy{background:var(--busy-bg)}

  .months{display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));gap:clamp(14px,2.2vw,22px)}
  .m{background:var(--card);border:1px solid var(--line);border-radius:14px;
     padding:18px 16px 16px;box-shadow:var(--shadow)}
  .cal{width:100%;border-collapse:separate;border-spacing:5px;table-layout:fixed;margin:6px -5px -5px}
  .cal caption{text-align:left;padding:0 5px 6px}
  .cal caption b{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.02rem;display:block}
  .cal caption b .yr{color:var(--muted);font-weight:400}
  .cal caption em{font-style:normal;font-size:.74rem;color:var(--muted);letter-spacing:.02em}
  .cal th{font-size:.66rem;color:var(--muted);text-transform:uppercase;
          letter-spacing:.08em;font-weight:600;padding:0 0 2px}
  .cal th abbr{text-decoration:none}
  .cal td{padding:0}
  .d{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
     font-size:.82rem;border-radius:7px;border:1px solid transparent}
  .d.free{background:var(--free-bg);border-color:var(--free-br)}
  .d.busy{background:var(--busy-bg);color:var(--busy-ink);
          text-decoration:line-through;text-decoration-thickness:1px}
  .d.past{opacity:.35}

  .skel{height:230px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
  footer{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-wrap:wrap;
         gap:16px;align-items:center;justify-content:space-between}
  .note{font-size:.8rem;color:var(--muted);max-width:52ch;margin:0}
  .note.alert{color:var(--warn);font-weight:500}
  .cta{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;
       padding:12px 22px;border-radius:9px;font-size:.88rem;font-weight:600;transition:opacity .15s ease}
  .cta:hover{opacity:.88}
  .cta:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Riad Dar Num · Médina de Marrakech</div>
    <h1>Disponibilités</h1>
    <p class="lede">Le riad se loue en entier. Deux nuits minimum, jusqu'à neuf personnes.
      Les dates barrées sont des nuits déjà réservées ; un jour de départ redevient
      disponible le jour même.</p>
  </header>

  <div class="legend">
    <span><span class="sw free"></span>Disponible</span>
    <span><span class="sw busy"></span>Réservé</span>
  </div>

  <div class="months" id="months"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>

  <footer>
    <p class="note" id="note" role="status" aria-live="polite">Chargement des disponibilités…</p>
    <a class="cta" href="https://www.riaddarnum.com/r%C3%A9servations" target="_top" rel="noopener">Demander ces dates</a>
  </footer>
</div>

<script>
(function(){
  "use strict";

  var MOIS = ['janvier','février','mars','avril','mai','juin',
              'juillet','août','septembre','octobre','novembre','décembre'];
  var JOURS = [['L','lundi'],['M','mardi'],['M','mercredi'],['J','jeudi'],
               ['V','vendredi'],['S','samedi'],['D','dimanche']];
  var FUSEAU = 'Africa/Casablanca';
  var PEREMPTION = 3;      // jours au-delà desquels les données sont annoncées comme datées
  var DELAI_FETCH = 8000;  // ms

  var elMois = document.getElementById('months');
  var elNote = document.getElementById('note');

  // Thème : clair par défaut, la page hôte demande explicitement autre chose.
  var theme = (new URLSearchParams(location.search).get('theme') || '').toLowerCase();
  if (theme === 'dark' || theme === 'auto') document.documentElement.setAttribute('data-theme', theme);
  if (theme === 'transparent') document.documentElement.setAttribute('data-ground', 'none');

  // « Aujourd'hui » au Maroc, pas dans le fuseau du visiteur : un client à Sydney
  // ne doit pas voir une nuit marquée passée alors qu'elle est encore réservable.
  function aujourdhui(){
    try {
      var p = new Intl.DateTimeFormat('en-CA', {timeZone: FUSEAU, year:'numeric', month:'2-digit', day:'2-digit'})
                .formatToParts(new Date())
                .reduce(function(a, x){ a[x.type] = x.value; return a; }, {});
      return new Date(+p.year, +p.month - 1, +p.day);
    } catch (e) {
      var d = new Date();
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }
  }

  // Élision : « d'octobre », pas « de octobre ».
  function deMois(m){ return (/^[aeiouyéèêâ]/.test(MOIS[m]) ? "d'" : 'de ') + MOIS[m]; }

  function texte(el, msg, alerte){
    el.textContent = msg;
    el.classList.toggle('alert', !!alerte);
  }

  function moisCalendrier(y, m, joursPris, today){
    var nbJours = new Date(y, m + 1, 0).getDate();
    var decalage = (new Date(y, m, 1).getDay() + 6) % 7;   // semaine commençant lundi
    var cases = [], libres = 0, i;

    for (i = 0; i < decalage; i++) cases.push('<td></td>');
    for (var j = 1; j <= nbJours; j++){
      var passe = new Date(y, m, j) < today;
      var pris = joursPris.has(j);
      if (!pris && !passe) libres++;
      cases.push('<td><span class="d ' + (pris ? 'busy' : 'free') + (passe ? ' past' : '') + '">'
               + j + '<span class="sr"> ' + (pris ? 'réservé' : 'disponible') + '</span></span></td>');
    }
    while (cases.length % 7) cases.push('<td></td>');

    var lignes = '';
    for (i = 0; i < cases.length; i += 7) lignes += '<tr>' + cases.slice(i, i + 7).join('') + '</tr>';

    var entete = JOURS.map(function(d){
      return '<th scope="col"><abbr title="' + d[1] + '">' + d[0] + '</abbr></th>';
    }).join('');

    return '<div class="m"><table class="cal"><caption>'
         + '<b>' + MOIS[m] + ' <span class="yr">' + y + '</span></b>'
         + '<em>' + (libres === 0 ? 'complet' : libres + (libres > 1 ? ' nuits libres' : ' nuit libre')) + '</em>'
         + '</caption><thead><tr>' + entete + '</tr></thead><tbody>' + lignes + '</tbody></table></div>';
  }

  function render(occ){
    if (!occ || typeof occ !== 'object') throw new Error('format');
    var today = aujourdhui();

    // On ne garde que les mois valides et non entièrement écoulés : si le flux
    // se fige, la page cesse d'afficher des mois périmés plutôt que de mentir.
    var cles = Object.keys(occ).filter(function(k){
      if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(k) || !Array.isArray(occ[k])) return false;
      var p = k.split('-');
      return new Date(+p[0], +p[1], 0) >= today;   // dernier jour du mois >= aujourd'hui
    }).sort();

    if (!cles.length){
      elMois.innerHTML = '';
      texte(elNote, 'Le calendrier est en cours de mise à jour. Écrivez-nous, nous vous confirmons les dates disponibles.', true);
      hauteur();
      return;
    }

    elMois.innerHTML = cles.map(function(ym){
      var p = ym.split('-');
      var pris = new Set(occ[ym].filter(function(n){ return Number.isInteger(n); }));
      return moisCalendrier(+p[0], +p[1] - 1, pris, today);
    }).join('');

    var dernier = cles[cles.length - 1].split('-');
    var horizon = 'Au-delà ' + deMois(+dernier[1] - 1) + ' ' + dernier[0] + ', nous consulter.';

    var maj = /^\d{4}-\d{2}-\d{2}$/.test(occ._updated || '') ? occ._updated.split('-') : null;
    if (!maj){
      texte(elNote, horizon, false);
    } else {
      var dateMaj = new Date(+maj[0], +maj[1] - 1, +maj[2]);
      var age = Math.round((today - dateMaj) / 86400000);
      var libelle = Number(maj[2]) + ' ' + MOIS[+maj[1] - 1] + ' ' + maj[0];
      if (age > PEREMPTION){
        texte(elNote, 'Ces disponibilités datent du ' + libelle
            + ' et n\'ont pas été actualisées depuis. Merci de les confirmer avec nous avant de réserver.', true);
      } else {
        texte(elNote, 'Mise à jour le ' + libelle + '. ' + horizon, false);
      }
    }
    hauteur();
  }

  // Permet à la page hôte (Wix) d'ajuster la hauteur de l'iframe au contenu.
  var derniereHauteur = 0;
  function hauteur(){
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h && h !== derniereHauteur && window.parent !== window){
      derniereHauteur = h;
      try { window.parent.postMessage({source: 'darnum-dispo', height: h}, '*'); } catch (e) {}
    }
  }
  window.addEventListener('resize', hauteur);
  if (window.ResizeObserver) new ResizeObserver(hauteur).observe(document.body);

  function echec(){
    elMois.innerHTML = '';
    texte(elNote, 'Disponibilités momentanément indisponibles. Écrivez-nous, nous vous répondons rapidement.', true);
    hauteur();
  }

  var stop = window.AbortController ? new AbortController() : null;
  var minuteur = setTimeout(function(){ if (stop) stop.abort(); }, DELAI_FETCH);

  fetch('occupancy.json', {cache: 'no-cache', signal: stop ? stop.signal : undefined})
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(data){ clearTimeout(minuteur); render(data); })
    .catch(function(){ clearTimeout(minuteur); echec(); });
})();
</script>
</body>
</html>
